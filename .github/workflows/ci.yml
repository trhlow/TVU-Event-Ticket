name: CI

on:
  push:
    branches: [main, hlow]
  pull_request:
    branches: [main]

# Least privilege at the file level, so a job that needs more has to say so and the saying is
# reviewable. Without this the token takes the repository default, which is commonly write on
# contents -- and this workflow runs `npm ci`, `mvn verify` and `docker build`, all of which
# execute third-party code with that token in the environment. The publish job that a later
# commit adds needs `packages: write`; it gets it on that job, never here.
permissions:
  contents: read


jobs:
  # The backend is a single Maven module.  Keep frontend checks independent so
  # a UI-only change does not need a Java build and vice versa.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            # The workflow and its scripts appear under BOTH filters on purpose. Without that, a
            # change touching only CI could skip both jobs while ci-gate still reported success —
            # a green gate that verified nothing.
            backend:
              - 'backend/pom.xml'
              - 'backend/Dockerfile'
              - 'backend/monolith/**'
              - 'backend/infra/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    # The path filter alone would let a push to main that only touches frontend code skip this job --
    # but publish-prepare always needs BOTH images freshly built for the commit it is releasing, path
    # filter or not. A skipped dependency skips its downstream jobs by default, so publish-prepare
    # would silently skip (or fail on a missing artifact) the first time a real release touched only
    # one side. The path filter still applies on pull_request, where fast incremental feedback matters
    # and no publish ever runs.
    if: needs.changes.outputs.backend == 'true' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & test modular monolith
        working-directory: backend
        run: mvn -B -pl monolith -am verify

      - name: Cache dependency vulnerability data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-v1

      - name: Dependency vulnerability scan
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # ossindexAnalyzerEnabled=false: OSS Index is a separate service from the NVD and rejects
        # unauthenticated requests with HTTP 401, which failed this step on every run regardless of the
        # code being scanned -- and because it failed, the two steps after it never ran at all. NVD data
        # (the actual CVE source, keyed by NVD_API_KEY) is unaffected. Re-enable with OSS Index
        # credentials if that feed is wanted.
        # formats=HTML,JSON: the plugin writes only HTML by default, and the step after this one
        # reads the JSON to prove two below-threshold CVEs are absent. HTML stays for humans.
        # suppressionFiles: one narrowly scoped entry, pinned to a single package version and a
        # single CVE, with its reasoning and an expiry date in the file. Preferred order is always
        # to pin a fixed version instead (see pom.xml's properties block); a suppression is only for
        # a CVE with no fixed release yet. The threshold itself is never lowered to get a green run.
        #
        # Absolute path on purpose: the goal runs across a two-module reactor, and a relative
        # suppressionFiles is resolved against each module's own basedir -- so `monolith` would look
        # for a file that is not there.
        run: |
          test -f dependency-check-suppressions.xml || {
            echo "dependency-check-suppressions.xml is missing; refusing to scan without the file"
            echo "this step claims to be applying."
            exit 1
          }
          mvn -B -pl monolith -am org.owasp:dependency-check-maven:12.1.1:check -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY" -DossindexAnalyzerEnabled=false -Dformats=HTML,JSON -DsuppressionFiles="$PWD/dependency-check-suppressions.xml"

      - name: Prove the patched CVEs are absent, not merely below the threshold
        working-directory: backend
        # A green scan above says only that nothing scored CVSS >= 7. These two were patched while
        # sitting *below* that threshold, so the scan would stay green whether they were fixed or
        # not. Reading the report itself is what makes the fix a repeatable check instead of a
        # one-time observation.
        #
        #   CVE-2026-54515  jackson-databind  -> 2.21.5
        #   CVE-2026-49844  log4j-api         -> 2.25.5
        run: |
          report=monolith/target/dependency-check-report.json
          if [ ! -f "$report" ]; then
            echo "No dependency-check report at $report — the scan did not produce one, so this"
            echo "check cannot prove anything. Failing rather than passing on a missing file."
            exit 1
          fi
          failed=0
          for cve in CVE-2026-54515 CVE-2026-49844; do
            if grep -q "$cve" "$report"; then
              echo "::error::$cve is still reported. The pin for it has regressed."
              failed=1
            else
              echo "ok: $cve absent from the report"
            fi
          done
          exit $failed

      - name: Prove no webjar reached the packaged artifact
        working-directory: backend
        # The Enforcer ban stops a webjar being declared; this checks what actually got packaged.
        # They are different questions: the ban reads the dependency graph, this reads the jar that
        # ships. A test running under surefire cannot answer it either — that classpath is flat,
        # while the artifact nests its dependencies under BOOT-INF/lib.
        run: |
          jar=$(find monolith/target -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*original*' | head -1)
          if [ -z "$jar" ]; then
            echo "No packaged jar found — nothing to inspect. Failing rather than passing silently."
            exit 1
          fi
          echo "Inspecting $jar"
          if unzip -l "$jar" | grep -E 'BOOT-INF/lib/.*webjar|META-INF/resources/webjars'; then
            echo "::error::A webjar is packaged in the deployable artifact."
            echo "This application serves no static assets, so nothing renders it — but it ships and"
            echo "Spring Boot maps /webjars/** onto it. See the Enforcer ban in backend/pom.xml."
            exit 1
          fi
          echo "ok: no webjar in the packaged artifact"

      - name: Fail if any test was skipped
        working-directory: backend
        run: |
          # An array, not a word-split string: a path with a space in it would otherwise become two
          # arguments and the count would be wrong in the direction that passes. This is the SC2086
          # that M11 recorded and that the shellcheck job does not reach -- it lints the production
          # scripts, not the `run:` blocks in this file. actionlint is what covers these.
          #
          # find's exit status is checked rather than discarded with `|| true`. Piping it into
          # mapfile through a process substitution would report success whatever find did, so a
          # find that failed halfway through would look exactly like a clean run with fewer files
          # -- fewer files being the direction that passes this check.
          if ! found=$(find monolith/target/surefire-reports -name 'TEST-*.xml' 2>&1); then
            echo "Could not list surefire reports: $found"
            exit 1
          fi
          if [ -z "$found" ]; then
            echo "No surefire reports found for monolith — the suite did not run."
            exit 1
          fi
          mapfile -t reports <<< "$found"
          skipped=$(grep -ho 'skipped="[0-9]*"' "${reports[@]}" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          if [ "$skipped" -ne 0 ]; then
            echo "$skipped test(s) were skipped. Testcontainers tests skip silently without Docker —"
            echo "a skipped run is not a passing run. Failing the build."
            grep -l 'skipped="[1-9]' "${reports[@]}" || true
            exit 1
          fi
          echo "No tests were skipped."

      - name: Fail if demo credentials reached production config
        working-directory: backend
        run: |
          # grep exits 2 when the file is missing, which reads as "no match" to `if` -- so renaming
          # or moving the config would have retired this gate silently. The absence of the input is
          # a failure of the check, not a pass of it.
          config=monolith/src/main/resources/application-prod.yml
          if [[ ! -f "$config" ]]; then
            echo "$config is missing; this gate cannot check what it claims to check."
            exit 1
          fi
          if grep -rniE "sadminevt|123456" "$config"; then
            echo "Demo sign-in credentials must never appear in production configuration."
            exit 1
          fi
          echo "No demo credentials in production config."

      - name: Build deployable monolith image
        working-directory: backend
        run: docker build -t tvu/monolith:ci .

      # Only on the run that can actually publish: an artifact upload on every PR run would be pure
      # waste, and the byte that gets attested/pushed must be exactly the byte this job just tested --
      # docker save right after the build that produced it, not a separate build in the publish job
      # that could drift from what backend's own steps above just verified.
      - name: Save the built monolith image for the publish job
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: backend
        run: docker save tvu/monolith:ci | gzip > monolith-image.tar.gz

      - name: Upload the monolith image artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monolith-image
          path: backend/monolith-image.tar.gz
          retention-days: 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  frontend:
    needs: changes
    # Same reasoning as backend's own if: condition above -- publish-prepare always needs both images
    # freshly built for the commit it is releasing.
    if: needs.changes.outputs.frontend == 'true' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    # No job-level VITE_* here, deliberately. Vite gives an actual environment variable precedence
    # over .env.production, so a value set at this level reached `npm run build:production` and the
    # bundle the evidence gate inspected was built with it -- while the image built two steps later
    # never saw it and baked the value from the tracked file instead. CI was verifying one bundle
    # and shipping another, which is the specific thing H10 exists to prevent.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Must match frontend/Dockerfile (which builds the artifact that ships) and .nvmrc.
          # Three different Node versions meant a green CI said nothing about the real image:
          # the same suite passes on 22 and fails on 26.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build production artifact and prove it carries no test or mock code
        working-directory: frontend
        # build:production runs the bundle evidence gate: no fixture import, mock chunk,
        # or stray legacy storage key.
        run: npm run build:production

      - name: Audit dependencies
        working-directory: frontend
        # No `|| true`. Fail-open meant a known high-severity CVE left the gate green, which is the
        # same as not running it. If a finding has to be accepted, accept it explicitly with
        # `npm audit --omit=dev` scope or an override, in a commit someone reviewed.
        run: npm audit --audit-level=high

      - name: Fail if a real .env file was accidentally committed
        run: |
          # .env.production is tracked on purpose: it carries the invariants of a
          # production build so CI, docker and manual builds cannot disagree. Everything
          # else that looks like an env file is still a mistake.
          if git ls-files frontend | grep -E '^frontend/\.env($|\.[^.]*$)' \
             | grep -vE '\.env\.(example|production)$'; then
            echo "A real .env file is tracked in git — remove it and rotate any secrets it held."
            exit 1
          fi
          # A tracked env file is only safe while it holds no secrets, and it ends up in
          # the bundle either way, so check rather than trust the comment in it.
          # Only assignment lines: the file's own comment explains why secrets are banned,
          # and matching that comment would fail the build on its own documentation.
          if grep -vE '^\s*#' frontend/.env.production \
             | grep -inE '(secret|password|token|private[_-]?key)'; then
            echo "frontend/.env.production is committed and shipped in the bundle — it must not hold secrets."
            exit 1
          fi
          echo "No unexpected tracked .env file, and .env.production holds no secrets."

      - name: Fail if the production bundle contains DevStub UI
        working-directory: frontend
        # Fixture data is covered by the evidence gate in build:production above; this
        # only guards the dev-only sign-in UI, which is not fixture data.
        run: |
          # Same shape as the demo-credentials gate: an unexpanded glob makes grep exit 2, which
          # reads as clean. A bundle that was never built is not a bundle without dev-only UI.
          if [[ ! -d dist/assets ]]; then
            echo "dist/assets is missing; the production bundle was not built."
            exit 1
          fi
          if grep -rl "DEV ONLY" dist/assets/*.js 2>/dev/null; then
            echo "Production bundle contains dev-only login UI."
            exit 1
          fi
          echo "No dev-only login UI in the bundle."

      - name: Build deployable frontend image
        working-directory: frontend
        run: docker build -t tvu/frontend:ci .

      # Same reasoning as backend's own "Save the built monolith image" step above.
      - name: Save the built frontend image for the publish job
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: frontend
        run: docker save tvu/frontend:ci | gzip > frontend-image.tar.gz

      - name: Upload the frontend image artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-image
          path: frontend/frontend-image.tar.gz
          retention-days: 1

  # Aggregate gate. `backend` and `frontend` are skipped by their own `if:` when the
  # path filter does not match, and `dependency-review` does not exist at all on push
  # events -- requiring those contexts directly in branch protection would block every
  # PR that happens not to touch them. This job always runs, so it is the one safe
  # context to require on main.
  lint:
    # Unconditional: these scripts are the deploy path and these workflows are what decide whether
    # anything reaches production. A run that skipped them because the filter saw no change is a run
    # that says nothing about them, and both checks are seconds.
    #
    # Bounded, because this job carries the mutation runner: 63 mutations x a full suite each, about
    # 25 minutes when healthy. The default job timeout is six hours, so a mutant that hangs would
    # hold a runner for six hours and block every PR behind it. 60 turns that into a legible
    # failure with room for a slow runner.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint workflows
        # actionlint is what reads the `run:` blocks in these files. The shellcheck step below only
        # sees backend/infra/production/scripts, which is how two SC2086 findings recorded under M11
        # survived the commit that added it.
        #
        # Downloaded and checksummed rather than taken from an action, so the thing that inspects
        # every workflow is itself pinned to bytes rather than to a tag someone else can move.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "$archive" "$url"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          # -shellcheck= wires shellcheck into the `run:` blocks; ubuntu-latest ships it.
          ./actionlint -color -shellcheck=shellcheck

      - name: Test the CI gate helpers
        # These decide whether an artifact may be published and whether a deploy may proceed.
        # Linting them is not running them.
        run: |
          bash .github/scripts/require-green-run.test.sh
          bash .github/scripts/publish-decision.test.sh
          bash .github/scripts/interpreter-override.test.sh
          # The canonical form is what a checksum is computed over, so a change to it silently
          # invalidates every checksum already written down. Pinned against golden bytes and a
          # digest taken with sha256sum rather than with the function under test.
          bash .github/scripts/canonical.test.sh
          bash .github/scripts/envelope.test.sh
          # A guard nobody can delete without a test going red is the only kind that is evidence.
          python3 .github/scripts/publish-decision.mutations.py
          # Both of these drive a copy of their subject over a fake tree, so they catch a subject
          # that has grown a dependency its callers do not carry -- which is how canonical.py
          # arriving was noticed.
          bash .github/scripts/publish-decision.mutations.test.sh

      - name: Check the contract and the decision still agree
        # The schema and the decision function state the same rules in two languages, and they have
        # already drifted apart once -- for two commits no observation could satisfy both. This runs
        # every fixture through both halves. jsonschema is pinned and installed rather than assumed:
        # the test refuses to run without it instead of reporting the green of a check that did
        # nothing.
        run: |
          # referencing is pinned beside jsonschema rather than left to arrive with it. It is what
          # resolves a $ref from one contract file into another, so an unpinned version is an
          # unpinned answer to "which schema did this fixture actually get checked against" -- the
          # one question this whole directory exists to make unambiguous.
          python3 -m pip install --quiet --disable-pip-version-check \
            jsonschema==4.26.0 referencing==0.37.0
          bash .github/scripts/contract-agreement.test.sh
          # How it reports a disagreement, which is the half that decides whether anyone can act on
          # one. Runs here rather than beside the others because it needs the same jsonschema.
          bash .github/scripts/contract-agreement.report.test.sh
          # The envelope constants are stated three times -- in the schema, in envelope.py, and in
          # the decision -- because a .json and a .py cannot reference each other and the decision
          # must run without the contracts directory beside it. This is what holds the three
          # together, and section 9 item 4's witnesses that schema validation is not the gate.
          bash .github/scripts/manifest-agreement.test.sh
          # The evidence-set carrier had no decision-side consumer until 3b commit 2 gave the
          # decision evidenceSetLookup -- so unlike its siblings this suite asserts schema accept/
          # reject only. It exists at all because release-envelope.schema.json shipped once with
          # zero witnesses on its entire validated content and a whole-branch review had to find that.
          bash .github/scripts/evidence-set-schema.test.sh
          # Three standalone predicate schemas (spec section 7) freezing what a scanner attestation
          # must contain and excluding the other kind's identity fields. Like evidence-set-schema.
          # test.sh, no decision-side consumer exists yet -- 3b commit 4 gives report/attestation
          # lookups their own real trust boundary -- so this suite asserts schema accept/reject only.
          bash .github/scripts/predicates-schema.test.sh

      - name: Test the frontend config canonicaliser
        # Linting this file is not running it. The fingerprint it produces is what a deploy uses to
        # refuse an image built for a different environment, and its first version returned the hash
        # of the empty string with exit 0 when python3 was unusable -- a check that could not fail.
        # Executed here so a regression cannot merge.
        run: |
          bash backend/infra/production/scripts/frontend-config.test.sh

          bash .github/scripts/common-sh-usage.test.sh

      - name: Lint deployment and operations scripts
        # These scripts run on the production host with set -euo pipefail and no one watching. The
        # failure mode they are exposed to is not a syntax error -- `bash -n` already catches those
        # -- but an unquoted expansion or an unset variable that silently does the wrong thing on a
        # path with a space in it. shellcheck is the only thing in this pipeline that looks for that.
        run: |
          shopt -s nullglob
          scripts=(backend/infra/production/scripts/*.sh .github/scripts/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No scripts matched — the path must have moved. Failing rather than passing on an"
            echo "empty set, which is how this check would quietly stop checking anything."
            exit 1
          fi
          echo "Linting ${#scripts[@]} script(s):"
          for script in "${scripts[@]}"; do echo "  $script"; done
          # -x lets shellcheck read the sourced file at all; without it `source common.sh` is opaque
          # and every helper it defines reads as an unassigned variable. --source-path=SCRIPTDIR
          # resolves the relative `# shellcheck source=common.sh` directives against each script's
          # own directory rather than the working directory, which here is the repository root.
          # Both are required: with only one of them this job reports SC2154 on working scripts.
          shellcheck --severity=warning -x --source-path=SCRIPTDIR "${scripts[@]}"

  ci-gate:
    # Hand-maintained on purpose -- there is no wildcard for `needs` -- which means a job added
    # above and not added here passes this gate by not being in it. Anyone adding a job adds it to
    # both this list and the env block and the case statement below.
    needs: [changes, backend, frontend, dependency-review, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI results
        env:
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs['dependency-review'].result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          set -uo pipefail
          failed=0
          fail() { echo "::error::$1"; failed=1; }

          # Everything else is gated on `changes`, so a skip or failure here makes the
          # whole run untrustworthy. It must have run and passed.
          [ "$CHANGES_RESULT" = success ] || fail "changes: expected success, got '$CHANGES_RESULT'"

          # A skipped path job counts as a pass ONLY when the filter genuinely reported
          # "unchanged". A blanket "skipped is fine" rule would be fail-open: a job
          # skipped for any unforeseen reason would silently satisfy the gate.
          check_path_job() {
            name="$1"; result="$2"; changed="$3"
            case "$result" in
              success) ;;
              skipped)
                if [ "$changed" != false ]; then
                  fail "$name: skipped but changes.outputs.$name='$changed' (expected 'false')"
                fi
                ;;
              *) fail "$name: expected success, got '$result'" ;;
            esac
          }
          check_path_job backend "$BACKEND_RESULT" "$BACKEND_CHANGED"
          check_path_job frontend "$FRONTEND_RESULT" "$FRONTEND_CHANGED"

          # dependency-review runs on pull_request only; on push it is skipped by design.
          if [ "$EVENT" = pull_request ]; then
            [ "$DEPENDENCY_REVIEW_RESULT" = success ] \
              || fail "dependency-review: expected success on pull_request, got '$DEPENDENCY_REVIEW_RESULT'"
          fi

          # lint has no path filter, so there is no legitimate reason for it to be skipped.
          [ "$LINT_RESULT" = success ]             || fail "lint: expected success, got '$LINT_RESULT'"

          [ "$failed" -eq 0 ] || exit 1
          echo "All CI jobs accounted for."

  # --- Publish: three jobs, because attestation creation cannot live inside a script a workflow
  # merely invokes -- actions/attest-build-provenance and actions/attest each exchange the JOB's own
  # OIDC token (id-token: write) for a Sigstore-signed attestation, which is only reachable from a
  # discrete workflow step. See run-publish.py's own module docstring for the full reasoning.
  #
  # publish-decision.sh (already merged, CI-verified) hard-requires verification.attestationVerified:
  # true for both the marker and every evidence report -- there is no path around it (design doc
  # 2026-08-11-collector-publish-job-design.md section 7b).
  #
  # Registry paths are the real, hardcoded constants build-expected.py's own SOURCE_REPOSITORY/
  # REGISTRY/REPOSITORIES already state (build-expected.test.py proves them) -- publish-decision.sh
  # real-binds every queriedRef against exactly those values, so what gets pushed here must match them
  # literally, not be derived from GitHub context expressions that could drift from that hardcoded set.

  publish-prepare:
    needs: [backend, frontend, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      subjects: ${{ steps.push.outputs.subjects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monolith-image
          path: publish-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-image
          path: publish-artifacts

      - name: Decompress the built images
        run: |
          gunzip publish-artifacts/monolith-image.tar.gz
          gunzip publish-artifacts/frontend-image.tar.gz

      # Pinned to the exact versions this pipeline was built and real-TDD'd against tonight (design doc
      # 2026-08-11-collector-publish-job-design.md's own record: syft 1.51.0, Trivy 0.73.0, crane
      # 0.21.9 via scoop) -- a version drift here is exactly the kind of untested-behavior risk this
      # whole pipeline exists to catch elsewhere, so it must not be introduced by "latest" here.
      - name: Install crane, syft, trivy (pinned, checksummed)
        env:
          CRANE_VERSION: 0.21.9
          CRANE_SHA256: 5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e
          SYFT_VERSION: 1.51.0
          SYFT_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
          TRIVY_VERSION: 0.73.0
          TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum --check --strict
          tar -xzf crane.tar.gz crane
          sudo install crane /usr/local/bin/crane

          curl --fail --silent --show-error --location --output syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict
          tar -xzf syft.tar.gz syft
          sudo install syft /usr/local/bin/syft

          curl --fail --silent --show-error --location --output trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push candidate images, evidence, and the prepared marker
        id: push
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-push.py \
            --monolith-tarball publish-artifacts/monolith-image.tar \
            --frontend-tarball publish-artifacts/frontend-image.tar \
            --monolith-ref ghcr.io/trhlow/tvu-event-ticket/monolith \
            --frontend-ref ghcr.io/trhlow/tvu-event-ticket/frontend \
            --release-ref ghcr.io/trhlow/tvu-event-ticket/release \
            --commit "${{ github.sha }}" --environment production \
            --repo-root "$PWD" \
            --ruleset .github/scripts/collector-fixtures/trivy-secret-ruleset.yaml \
            --ignore-file .github/scripts/collector-fixtures/vulnerability-ignore.yaml \
            --output-dir publish-artifacts/out
          echo "subjects=$(cat publish-artifacts/out/subjects.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-predicates
          path: publish-artifacts/out/predicates
          retention-days: 1

  publish-attest:
    needs: publish-prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    strategy:
      # One real actions/attest or actions/attest-build-provenance step per subject -- this is a real
      # workflow step, not a script loop, precisely because only a real step can exchange this job's
      # OIDC token. fail-fast off: one unsigned subject must not hide whether the other ten would also
      # have signed cleanly, since publish-finalize needs to know the real, complete picture either way.
      matrix:
        include: ${{ fromJson(needs.publish-prepare.outputs.subjects) }}
      fail-fast: false
    steps:
      # push-to-registry: true makes both attest actions below push the attestation to GHCR via the
      # OCI referrers API -- a separate operation from the attestation API itself, and one that needs
      # real registry credentials on THIS job's own runner. publish-prepare's own GHCR login does not
      # carry over: each matrix job here is a fresh runner (confirmed for real 2026-08-12, first CI
      # run to reach this step: "Error: No credentials found for registry ghcr.io").
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.kind == 'generic'
        with:
          name: publish-predicates
          path: predicates

      # The one PREDICATE_TYPES entry (slsa.dev/provenance/v1) that actually matches what this action
      # produces -- see run-publish.py's own module docstring. No predicate input: it builds its own
      # real SLSA provenance statement from this job's GitHub Actions context.
      - name: Attest build provenance
        if: matrix.kind == 'provenance'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.subjectName }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true

      # The 10 subjects (2 evidence-set carriers, 8 per-kind reports) carrying this project's own
      # custom predicate types -- their predicate content is the exact document already pushed as that
      # subject's OCI blob, downloaded above from publish-prepare's own artifact.
      - name: Attest custom predicate
        if: matrix.kind == 'generic'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.subjectName }}
          subject-digest: ${{ matrix.digest }}
          predicate-type: ${{ matrix.predicateType }}
          # predicate-path, NOT predicate-file: actions/attest's real input list is
          # [subject-path, subject-digest, subject-name, subject-checksums, subject-version,
          # sbom-path, predicate-type, predicate, predicate-path, push-to-registry,
          # create-storage-record, show-summary, github-token]. An unknown input is only a WARNING in
          # Actions, never an error, so the wrong name here failed at runtime ("One of predicate-path
          # or predicate must be provided") rather than at parse time -- and actionlint cannot catch
          # it either, since it does not validate third-party action input names.
          predicate-path: ${{ matrix.predicateFile }}
          push-to-registry: true

  publish-finalize:
    needs: [publish-prepare, publish-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Deliberately does not download publish-prepare's own artifacts or reuse anything it computed --
      # design doc section 4's own rule is that the decision must never trust a job's memory of what it
      # pushed. Everything here is re-read fresh from the registry, now carrying the real attestations
      # publish-attest's matrix just created.
      - name: Decide and finalize the release
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish-finalize.py \
            --monolith-ref ghcr.io/trhlow/tvu-event-ticket/monolith \
            --frontend-ref ghcr.io/trhlow/tvu-event-ticket/frontend \
            --release-ref ghcr.io/trhlow/tvu-event-ticket/release \
            --commit "${{ github.sha }}" --environment production \
            --repo-root "$PWD"
