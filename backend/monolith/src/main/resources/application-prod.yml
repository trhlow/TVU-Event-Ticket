server:
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  # No static resource mappings in production. See the springdoc block at the end of this file:
  # this is what stops /webjars/** from serving the packaged Swagger UI by a second road.
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      max-lifetime: 1800000
  jpa:
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: db,redis,rabbit
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: production
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mail:
      # EMAIL_OTP is the only way an admin can sign in. With this off, a broken SMTP is
      # invisible until someone tries to log in and cannot -- by which point there is no
      # admin available to fix it. Deliberately NOT added to the readiness group above:
      # students browsing events need no email, so mail must not take the site out of
      # rotation. Consequences accepted on purpose: overall /actuator/health goes DOWN,
      # so smoke-test.sh fails the deploy and `docker ps` shows monolith unhealthy until
      # SMTP recovers. Traffic keeps flowing -- compose has no rotation to drop out of.
      enabled: true

tvu:
  auth:
    jwt:
      issuer: ${JWT_ISSUER_URI}
      ttl: ${JWT_TTL:15m}
      key-id: ${JWT_KEY_ID}
      private-key-pem: ${JWT_PRIVATE_KEY_PEM}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM}
    csrf:
      signing-secret: ${CSRF_SIGNING_SECRET}
    bootstrap:
      email: ${BOOTSTRAP_ADMIN_EMAIL}
    cookies:
      secure: true
      same-site: Lax
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID}
      tenant-id: ${MICROSOFT_TENANT_ID}
      issuer-host: ${MICROSOFT_ISSUER_HOST:https://login.microsoftonline.com}
      jwks-uri: ${MICROSOFT_JWKS_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}
  notification:
    mail:
      from-address: ${MAIL_FROM_ADDRESS}
      from-name: ${MAIL_FROM_NAME:TVU Events}
    qr:
      signing-secret: ${QR_SIGNING_SECRET}
  ticket:
    qr:
      secret: ${QR_SIGNING_SECRET}

# Off in production, on everywhere else. SecurityConfig still permits /v3/api-docs and
# /swagger-ui so the documentation works in dev and test; here the endpoints are simply never
# created. Caddy not routing them and the container not publishing a port are properties of the
# environment — one `ports:` line added while debugging undoes both — whereas this default ships
# and is tested with the artifact itself.
#
# A default, though, not an invariant: SPRINGDOC_API_DOCS_ENABLED=true in the environment still
# overrides this file and nothing in the build would notice. That is why smoke-test.sh asks the
# running application over its own loopback instead of trusting this YAML.
#
# It also stops serving the swagger-ui webjar's third-party JavaScript in production, which is
# what made the DOMPurify CVE reachable in the first place. The webjar is
# still packaged — BOOT-INF/lib/swagger-ui-*.jar is in the fat JAR either way — so the dependency
# scan must keep checking it; this setting removes the route to it, not the code.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Turning springdoc off removes springdoc's handlers, not Spring Boot's. Boot maps /webjars/**
# onto classpath:/META-INF/resources/webjars/ by default, the swagger-ui webjar is still packaged
# there, and webjars-locator-lite resolves the versionless form — so /webjars/swagger-ui/index.html
# reaches the same UI by a second road. Today that road is behind `anyRequest().authenticated()`,
# which means any signed-in student, not the public; it is one permitAll edit away from worse.
#
# This monolith serves no static resources of its own — the frontend is a separate Nginx container
# and there is no src/main/resources/static — so dropping the mappings costs nothing here.
# The setting itself lives in the `spring:` block at the top of this file, next to the rest of the
# framework configuration; it is `spring.web.resources.add-mappings: false`.
