name: tvu-event-ticket

services:
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    # Caddy terminates TLS and proxies; it holds no state.
    mem_limit: 128m
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      monolith:
        condition: service_healthy
    networks:
      - public
      - application
    logging: &json_logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # Pulled, not built here (roadmap 4.1: build once in CI, deploy by verified tag). deploy.sh sets
    # this to the commit-tagged GHCR reference CI's publish pipeline promotes only after
    # publish-decision.sh confirms COMPLETE. The frontend configuration lives in
    # frontend/.env.production and is fingerprinted by scripts/frontend-config.sh, so a given commit
    # produces a given bundle wherever it was built -- this host no longer needs to build it at all.
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set -- deploy.sh sets it automatically}
    restart: unless-stopped
    # Static assets over nginx.
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Matching what monolith already had. The two services being configured differently was drift,
    # not a decision.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - public
    logging: *json_logging

  monolith:
    # Pulled, not built here (roadmap 4.1: build once in CI, deploy by verified tag). deploy.sh sets
    # this to the commit-tagged GHCR reference CI's publish pipeline promotes only after
    # publish-decision.sh confirms COMPLETE.
    image: ${MONOLITH_IMAGE:?MONOLITH_IMAGE must be set -- deploy.sh sets it automatically}
    restart: unless-stopped
    # JVM: -Xmx768m of heap, plus metaspace, thread stacks and the JIT. Below about 1g the container is killed while the heap still looks healthy.
    mem_limit: 1200m
    # NO env_file here, and that is the whole point of the split below. `env_file` injects EVERY key
    # in .env into the container, and an `environment:` block only overrides the names it lists --
    # so POSTGRES_USER and POSTGRES_PASSWORD, the schema owner's credentials, landed in the
    # application's own environment. Anything that could read /proc/self/environ could connect as
    # the owner and DROP the schema, which is exactly what three comments in this repository claimed
    # was impossible. Every key the application actually reads is named explicitly below; the list
    # comes from the ${...} placeholders in application*.yml, so a new one fails loudly at startup
    # rather than silently arriving with the owner's password beside it.
    environment:
      SPRING_PROFILES_ACTIVE: prod,monolith
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      # Runtime credentials only. POSTGRES_USER owns the schema and can DROP it; the application
      # must not hold that power, so an SQL injection or RCE here is confined to reading and
      # writing rows instead of rewriting the database.
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_TTL: ${JWT_TTL}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
      CSRF_SIGNING_SECRET: ${CSRF_SIGNING_SECRET}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
      OTP_PEPPER: ${OTP_PEPPER}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      # Defaults spelled the same as application-prod.yml's. Not left to Spring's own default: an
      # unset compose variable interpolates to the EMPTY STRING, and a property that is set to empty
      # is set -- Spring would take the empty value over its default and the app would start with no
      # JWKS endpoint at all.
      MICROSOFT_ISSUER_HOST: ${MICROSOFT_ISSUER_HOST:-https://login.microsoftonline.com}
      MICROSOFT_JWKS_URI: ${MICROSOFT_JWKS_URI:-https://login.microsoftonline.com/common/discovery/v2.0/keys}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      # Migrations run as a separate one-shot step (scripts/migrate.sh) using the owner account,
      # which is deliberately absent from this container's environment.
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_SSL_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_VHOST: /
      JAVA_TOOL_OPTIONS: -XX:+UseSerialGC -Xss512k -Xms128m -Xmx768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # READINESS, not overall health, and the difference decides whether the site stays up.
    # application-prod.yml puts db, redis and rabbit in the readiness group and deliberately leaves
    # mail out of it, in as many words: "students browsing events need no email, so mail must not
    # take the site out of rotation. Consequences accepted on purpose: overall /actuator/health goes
    # DOWN." This healthcheck read the overall status, so a broken SMTP made the container
    # unhealthy, caddy never started behind depends_on: service_healthy, and the whole site went
    # down -- exactly the outcome that comment says was ruled out. Two files, one intent, and the
    # one that ran won.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q status.:.UP <&3'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - application
      # Outbound. `application` is internal: true, so a container on it alone has no route off the
      # host and cannot even resolve a name -- which is why SMTP failed with UnknownHostException
      # rather than with a refused connection. Mail is the visible symptom; the one that matters is
      # that MICROSOFT_JWKS_URI points at login.microsoftonline.com, and a backend that cannot fetch
      # those keys cannot validate a single student's token. Sign-in could never have worked.
      #
      # Joining a second network grants egress; it publishes nothing. Only a `ports:` entry does
      # that, and this service has none, so the datastores stay unreachable from outside exactly as
      # before.
      - egress
    logging: *json_logging

  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    # Postgres: shared_buffers plus work_mem for a handful of concurrent students.
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - application
    logging: *json_logging

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    # Redis is OTP codes and short-lived session state, not a cache of the database.
    mem_limit: 192m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # maxmemory below the container limit, so Redis evicts inside its own budget instead of being
    # killed by the kernel at the edge of it. volatile-ttl because everything here has a TTL -- OTP
    # codes and session state -- so the key nearest expiry is the cheapest thing to lose. Without a
    # maxmemory Redis grows until the cgroup kills it, and a kill loses far more than an eviction.
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 150mb --maxmemory-policy volatile-ttl --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - application
    logging: *json_logging

  rabbitmq:
    image: rabbitmq:4.2-management-alpine@sha256:a51ed990cb4392ce136380fb01fdb8aab1203565953f5ea9711bf839b1b709db
    restart: unless-stopped
    # RabbitMQ holds queues in memory before they page out; 512m with the default 0.4 high-watermark starts flow control at ~205m, well before the host is in trouble.
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
    networks:
      - application
    logging: *json_logging

networks:
  public:
  # No route off the host. This is what keeps postgres, redis and rabbitmq unreachable from the
  # internet even if a `ports:` line were ever added to one of them by accident.
  application:
    internal: true
  # Outbound only, for the one service that has to reach the internet: the monolith talks to
  # Microsoft for JWKS and to the SMTP provider for one-time codes. Deliberately a separate network
  # rather than making `application` non-internal, so the datastores keep the property above.
  egress:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
